    Playstation3:
      source: "1G1R/Sony - PlayStation 3 (Retool)"
      slug: "ps3"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/bin/ps3dec.exe"
        dkeys: "D:/RomFiles/Sony - PlayStation 3 - Disc Keys TXT (4417) (2025-12-25 15-00-26)/"
