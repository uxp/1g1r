    ## Disc Systems
    Gamecube:
      source: "1G1R/Nintendo - GameCube (Retool)"
      slug: "gc"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/Dolphin-x64/DolphinTool.exe"
        options:
          compression_level: 5
          compression: "zstd"
          block_size: 131072
    Wii:
      source: "1G1R/Nintendo - Wii (Retool)"
      slug: "wii"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/Dolphin-x64/DolphinTool.exe"
        options:
          compression_level: 5
          compression: "zstd"
          block_size: 131072
    WiiWare:
      source: "1G1R/Nintendo - WiiWare (Retool)"
      slug: "wiiware"
      file_pattern: "*.wad"
    WiiU:
      source: "1G1R/Nintendo - WiiU (Retool)"
      slug: "wiiu"
      file_pattern: "*.wu[x|a]"
    Switch:
      source: "1G1R/Nintendo - Switch (Retool)"
      slug: "switch"
      file_pattern: "*.(nsp|xci)"

    Dreamcast:
      source: "1G1R/Sega - Dreamcast (Retool)"
      slug: "dreamcast"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/bin/chdman.exe"
    SegaCD:
      source: "1G1R/Sega - Mega CD & Sega CD (Retool)"
      slug: "segacd"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/bin/chdman.exe"
    Saturn:
      source: "1G1R/Redump - Sega - Saturn (Retool)"
      slug: "saturn"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/bin/chdman.exe"
    Playstation:
      source: "1G1R/Sony - PlayStation (Retool)"
      slug: "psx"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/PSXPackager/psxpackager.exe"
        options:
          quiet: true
          log: "E:/Logs/psxpackager.log"

    PSP:
      source: "1G1R/Sony - PlayStation Portable (Retool)"
      slug: "psp"
      file_pattern: "*.zip"
      conversion:
        tool: "E:/Programs/PSXPackager/psxpackager.exe"
        options:
          quiet: true
          log: "E:/Logs/psxpackager.log"

    Playstation2:
      source: "1G1R/Sony - PlayStation 2 (Retool)"
