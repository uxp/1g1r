backup:
  source: "D:/roms"
  dest: "D:/backup"
  filetypes:
    #bios:
    #  - "**/*"
    #cheats:
    #  - "**/*"
    #doom:
    #  - "**/*"
    ports:
      - "**/*"
    nes:
      - "*.srm"
      - "*.state"
      - "*.state.auto"
      - "*.state.png"
      - "*.state*"
    gb:
      - "*.srm"
      - "*.state.auto"
      - "*.state.png"
      - "*.state*"
    snes:
      - "*.srm"
      - "*.state.auto"
      - "*.state.png"
      - "*.state*"
    snesh:
      - "*.srm"
      - "*.state.auto"
      - "*.state.png"
      - "*.state*"
    dreamcast:
      - "data/dc_nvmem.bin"
      - "data/vmu_save_A1.bin"
      - "data/vmu_save_A2.bin"
      - "data/vmu_save_B1.bin"
      - "data/vmu_save_A2.bin"
    megadrive:
      - "*.srm"
      - "*.state.auto"
      - "*.state*"
    fbneo:
      - "*.fs"
    sfc:
      - "*.srm"
    psx:
      - "*.ldci"
      - "*.state"
      - "*.srm"
    psp:
      - "PSP/SAVEDATA/*"

